# Pull request CI. Job names (backend, frontend, api-types, e2e, infra) are stable: they are the
# required status checks for branch protection on main.
#
# infra/tests/*.bats are picked up by glob, so new files need no workflow change. Convention: a
# test file that builds images or starts containers declares `# bats file_tags=docker` on its
# second line. The "light" step runs everything WITHOUT that tag, the "docker" step runs only files
# WITH it. A tag that matches no test is not an error, so a missing or untagged file is harmless.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the runner's Docker.
      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  api-types:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duofinance
          POSTGRES_PASSWORD: duofinance
          POSTGRES_DB: duofinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duofinance -d duofinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        working-directory: backend
        run: ./mvnw -B -q spring-boot:run -Dspring-boot.run.profiles=dev,e2e > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Wait for backend health
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy in 180 s"
          tail -n 100 "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Generate API types
        working-directory: frontend
        run: |
          npm ci
          npm run api:types
      - name: Check schema.ts is up to date
        run: |
          if ! git diff --exit-code frontend/src/shared/api/schema.ts; then
            echo "::error::schema.ts out of date — run npm run api:types"
            exit 1
          fi
      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" || true

  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duofinance
          POSTGRES_PASSWORD: duofinance
          POSTGRES_DB: duofinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duofinance -d duofinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # With CI set, Playwright starts the backend and Vite itself. The html reporter is added on
      # top of the config's `github` reporter so playwright-report/ exists for the artifact.
      - name: Run e2e
        env:
          CI: 'true'
        run: npm run e2e -- --reporter=github,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck
      - name: shellcheck
        run: shellcheck infra/scripts/*.sh
      - name: bats (light, no Docker work)
        run: bats --filter-tags '!docker' infra/tests/*.bats
      - name: bats (Docker)
        run: bats --filter-tags docker infra/tests/*.bats
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest

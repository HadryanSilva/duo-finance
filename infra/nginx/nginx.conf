# Duo Finance edge nginx. Server blocks come from /etc/nginx/templates (rendered into conf.d by
# the official entrypoint); shared app rules live in /etc/nginx/snippets.
# No real_ip module: this nginx is the edge, so $remote_addr is the client.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # One JSON object per line on stdout (the image links access.log to /dev/stdout).
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log json;

    # Static text assets only: proxied API responses are not compressed (gzip_proxied is off).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;

    # HSTS only over HTTPS: the value is empty on plain HTTP, and add_header skips empty values.
    # Being a variable, it lives in snippets/security-headers.conf, which every location with its
    # own add_header re-includes (nginx drops inherited add_header directives in such locations).
    map $scheme $hsts_header {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    include /etc/nginx/conf.d/*.conf;
}

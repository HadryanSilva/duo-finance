# Proxy to the Spring Boot api. Included by every /api location.
# The upstream is a variable resolved through Docker's DNS at request time, so nginx follows the
# api container to its new address after a redeploy instead of keeping the IP it saw at startup.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8080;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";

# The backend (forward-headers-strategy native, Tomcat RemoteIpValve) trusts these, so each one
# is set here and never passed through from the client.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwritten, never appended: nginx is the edge, so any client-supplied entry is a forgery
# (appending would let it win whenever the peer address is private).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# nginx is the single source of these headers; drop the backend's copies to avoid duplicates.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;

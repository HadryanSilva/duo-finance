# App rules shared by templates/app.conf.template and templates/app-local.conf.template.
root /usr/share/nginx/html;

include snippets/security-headers.conf;

# Never cached: after a deploy the browser must pick up the new asset names at once.
location = /index.html {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
}

# Content-hashed build output: cached for a year; a missing asset is a 404, never index.html.
location /assets/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Session refresh and logout are authenticated by the HttpOnly refresh cookie, not by a password,
# and the SPA calls refresh on every full page load (and in every tab). Under the auth zone a few
# reloads a minute, or two partners behind one home IP, would get 429 and be signed out.
location = /api/v1/auth/refresh {
    include snippets/proxy.conf;
}

location = /api/v1/auth/logout {
    include snippets/proxy.conf;
}

# Credential endpoints (login, register, password reset, e-mail verification): brute-force limit.
location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;
    include snippets/proxy.conf;
}

location /api/v1/public/ {
    limit_req zone=public burst=10 nodelay;
    limit_req_status 429;
    include snippets/proxy.conf;
}

# Defence in depth: the e2e test endpoints never reach the api through the edge
# (the backend also refuses to run the e2e profile together with prod).
location /api/v1/__e2e {
    return 404;
}

location /api/ {
    include snippets/proxy.conf;
}

# SPA fallback: client-side routes (/transactions, /invite/<token>, ...) get index.html.
location / {
    try_files $uri $uri/ /index.html;
}

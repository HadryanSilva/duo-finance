# Security headers for every response, errors included (always).
# nginx drops inherited add_header directives in any block that declares its own, so this file is
# included at server level AND in every location with its own add_header (see app-common.conf).
# style-src has no 'unsafe-inline': checked in Chromium against the built app (register,
# onboarding, dialogs, dashboard charts with their tooltip, vue-sonner toasts, settings), with no
# violation. Vue, reka-ui, ECharts and vue-sonner set styles through CSSOM (el.style), which CSP
# allows. ECharts' default rich tooltip markup and its tooltip arrow are HTML with style="" and
# would be blocked; the app's charts use a plain-text formatter and no arrow, so neither runs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hsts_header always;

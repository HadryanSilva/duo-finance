# Test-only stand-in for the api service (nginx-stack.yml). Listens where the real api does
# (api:8080), answers the two endpoints the nginx tests call, and echoes the proxy headers it
# received as X-Echo-* response headers so the tests can see what nginx forwarded.
server {
    listen 8080;
    default_type application/json;

    add_header X-Echo-Host $http_host always;
    add_header X-Echo-Forwarded-For $http_x_forwarded_for always;
    add_header X-Echo-Forwarded-Proto $http_x_forwarded_proto always;
    add_header X-Echo-Real-IP $http_x_real_ip always;
    add_header X-Echo-Forwarded-Host $http_x_forwarded_host always;
    add_header X-Echo-Forwarded-Port $http_x_forwarded_port always;
    # Upstream security headers that nginx must hide, so each header is sent exactly once.
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /api/actuator/health {
        return 200 '{"status":"UP"}';
    }

    location = /api/v1/auth/login {
        return 401 '{"error":"bad credentials"}';
    }

    location / {
        return 200 '{"stub":true}';
    }
}

spring:
  application:
    name: duo-finance
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      # The statement is at most 1 MB; the commit request adds one decision per included row, so the
      # whole request may reach 2 MB. The threshold keeps uploads in memory: the file is never stored.
      max-file-size: 1MB
      max-request-size: 2MB
      file-size-threshold: 2MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /api/actuator

app:
  registration:
    mode: INVITE_ONLY
  email:
    provider: RESEND
  auth:
    cookie-secure: true
  recurring:
    scheduler-enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: duo-finance
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /api/actuator

app:
  registration:
    mode: INVITE_ONLY
  email:
    provider: RESEND
  auth:
    cookie-secure: true
  recurring:
    scheduler-enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
